services:
  email-checker:
    build:
      context: .
      dockerfile: Dockerfile
    image: email-checker:latest
    container_name: email-checker
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
